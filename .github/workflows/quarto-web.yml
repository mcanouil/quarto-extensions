name: Get Extensions from Quarto Website

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

# Every write goes through the App token, so GITHUB_TOKEN only has to clone.
permissions:
  contents: read

jobs:
  quarto-web:
    runs-on: ubuntu-latest
    steps:
      # A pull request opened with the default token triggers no workflow, so
      # its checks would never run.
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          require-app: true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}

      # One pull request per run, rather than per extension: a week's crawl
      # regularly finds several at once, and reviewing them together is both
      # cheaper in Actions minutes and easier to merge.
      - name: Get extensions from Quarto Website
        id: extensions
        shell: bash
        run: |
          CSV_FILE="extensions/quarto-extensions.csv"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/quarto-dev/quarto-web _quarto-web
          git -C _quarto-web sparse-checkout init --cone
          git -C _quarto-web sparse-checkout set docs/extensions/listings
          git -C _quarto-web checkout main --quiet
          find _quarto-web/docs/extensions/listings -type f -name "*.yml" ! -name "_*" \
            -exec grep -o 'path: https://github.com/.*' {} \; \
            | sed 's/path: https:\/\/github.com\///' | sed 's/blob\/[^/]*\///' > _quarto-web/quarto-web-extensions.csv
          cat "${CSV_FILE}" > _quarto-web/quarto-extensions.csv
          echo "gadenbuie/countdown" >> _quarto-web/quarto-extensions.csv # Don't add this extension as not available through tag
          extensions_to_add=$(grep -Fvxi -f _quarto-web/quarto-extensions.csv _quarto-web/quarto-web-extensions.csv || true)
          rm -rf _quarto-web

          count=0
          body=$'Extensions discovered on the Quarto website:\n\n'
          while IFS= read -r extension; do
            [[ -z "${extension}" ]] && continue
            echo "${extension}" >> "${CSV_FILE}"
            body+="- \`${extension}\`"$'\n'
            count=$((count + 1))
          done <<< "${extensions_to_add}"

          if [[ "${count}" -eq 0 ]]; then
            echo "No new extensions to add."
          elif [[ "${count}" -eq 1 ]]; then
            title="ci: add ${extensions_to_add} from quarto-web"
          else
            title="ci: add ${count} extensions from quarto-web"
          fi

          {
            echo "title=${title:-}"
            echo "body<<QUARTO_WEB_BODY"
            printf '%s' "${body}"
            echo "QUARTO_WEB_BODY"
          } >> "${GITHUB_OUTPUT}"

      - name: Open the pull request
        if: steps.extensions.outputs.title != ''
        uses: mcanouil/release-actions/land@v1
        with:
          mode: pull-request
          merge: none
          files: extensions/quarto-extensions.csv
          message: ${{ steps.extensions.outputs.title }}
          branch: ci/get-quarto-web-extensions
          body: ${{ steps.extensions.outputs.body }}
          token: ${{ steps.token.outputs.token }}
