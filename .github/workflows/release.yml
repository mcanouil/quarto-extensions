name: "Release: Bump Version & Create Release"

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    # Every write goes through the App token, so GITHUB_TOKEN only has to clone.
    permissions:
      contents: read

    steps:
      # The token must exist before the checkout. A checkout without an explicit
      # token persists GITHUB_TOKEN in .git/config, and the later push then
      # authenticates as github-actions[bot] whatever git config says.
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Get GitHub App User ID
        id: get-user-id
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "${GITHUB_OUTPUT}"

      - name: Git Config
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        shell: bash
        run: |
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Bump Version
        id: bump-version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT: "ci: bump version for release :rocket:"
          BRANCH: ci/bump-version
        shell: bash
        run: |
          if git show-ref --quiet "refs/heads/${BRANCH}"; then
            echo "Branch ${BRANCH} already exists."
            git branch -D "${BRANCH}"
            git push origin --delete "${BRANCH}"
          fi
          git checkout -b "${BRANCH}"
          DATE=$(date +%Y-%m-%d)
          VERSION=$(date +%Y.%m.%d)
          sed -i "s/^version:.*/version: ${VERSION}/" CITATION.cff
          sed -i "s/^date-released:.*/date-released: \"${DATE}\"/" CITATION.cff
          if git diff --quiet CITATION.cff; then
            echo "CITATION.cff is already up to date. Skipping PR creation."
          else
            git add CITATION.cff
            git commit -m "${COMMIT}"
            git push --force origin "${BRANCH}"
            sleep 5
            gh pr create --fill-first --base "main" --head "${BRANCH}" --label "Type: CI/CD :robot:"
            sleep 5
            gh pr merge --auto --squash --delete-branch
            sleep 5
          fi
          gh release create "${VERSION}" --title "${DATE}" --generate-notes
