name: "Release: Bump Version & Create Release"

on:
  workflow_dispatch:

# A release bumps a version, pushes a branch, and creates a tag, so two at once
# would race over all three. Queue rather than cancel: a cancelled release
# leaves the bump branch and its pull request behind.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    # Every write goes through the App token, so GITHUB_TOKEN only has to clone.
    permissions:
      contents: read

    steps:
      # The release event of the App token is what starts the Quarto Wizard
      # workflow, which the default token would not do.
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          require-app: true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}

      # The repository keeps no changelog: the body is the notes GitHub
      # generates from the merged pull requests.
      - name: Bump the version
        id: bump
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: calver
          changelog: ""
          token: ${{ steps.token.outputs.token }}
          ecosystems: citation

      - name: Land the bump
        id: land
        uses: mcanouil/release-actions/land@v1
        with:
          mode: pull-request
          files: ${{ steps.bump.outputs.files }}
          version: ${{ steps.bump.outputs.version }}
          message: "ci: bump version for release :rocket:"
          branch: ci/bump-version
          token: ${{ steps.token.outputs.token }}

      - name: Compose the release body
        id: notes
        uses: mcanouil/release-actions/notes@v1
        with:
          notes-file: ${{ steps.bump.outputs.notes-file }}
          tag: ${{ steps.bump.outputs.version }}
          target: ${{ steps.land.outputs.sha }}
          generate-notes: true
          token: ${{ steps.token.outputs.token }}

      - name: Release on GitHub
        uses: mcanouil/release-actions/release@v1
        with:
          version: ${{ steps.bump.outputs.version }}
          body-file: ${{ steps.notes.outputs.body-file }}
          title: "{date}{count}"
          target: ${{ steps.land.outputs.sha }}
          token: ${{ steps.token.outputs.token }}
