name: Quarto Wizard

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug mode"
        required: false
        default: false
        type: boolean
      force_update:
        description: "Force update all extensions"
        required: false
        default: false
        type: boolean
  repository_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main
    paths:
      - extensions/quarto-extensions.csv
  schedule:
    - cron: "0 6 * * *"

# Every write goes through the App token, so GITHUB_TOKEN only has to clone.
permissions:
  contents: read

# Cron, pushes to the CSV, releases and dispatches all write the same data
# branch, so they must not run concurrently. Queue rather than cancel: a
# cancelled run leaves the branch half-updated.
concurrency:
  group: quarto-wizard
  cancel-in-progress: false

jobs:
  get-extensions:
    runs-on: ubuntu-latest
    env:
      BRANCH: quarto-wizard
      COMMIT: "ci: update extensions details"
      CSV_FILE: "extensions/quarto-extensions.csv"
      JSON_FILE: "quarto-extensions.json"
      EXTENSIONS_DIR: "extensions"
      DEBUG_MODE: ${{ github.event.inputs.debug }}
      FORCE_UPDATE: ${{ github.event.inputs.force_update }}
    steps:
      # The token must exist before the first checkout. A checkout without an
      # explicit token persists GITHUB_TOKEN in .git/config, and the later push
      # then authenticates as github-actions[bot] whatever git config says.
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}
          require-app: true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
          token: ${{ steps.token.outputs.token }}

      - name: Checkout repository with sparse checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: ${{ env.CSV_FILE }}
          sparse-checkout-cone-mode: false
          path: data

      - name: Checkout scripts from main branch
        uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
          path: scripts-checkout

      - name: Copy scripts to working directory
        shell: bash
        run: |
          mkdir -p .github/scripts
          cp -r scripts-checkout/.github/scripts/* .github/scripts/
          rm -rf scripts-checkout

      # Social cards are downscaled to WebP before they are stored; the runner
      # image does not ship cwebp, so install it rather than assume it.
      - name: Install WebP tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update --quiet
          sudo apt-get install --quiet --yes webp
          cwebp -version

      - name: Get extensions details
        id: get-extensions-details
        shell: bash
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          DEBUG_MODE: ${{ env.DEBUG_MODE }}
          FORCE_UPDATE: ${{ env.FORCE_UPDATE }}
          EXTENSIONS_DIR: ${{ env.EXTENSIONS_DIR }}
          JSON_FILE: ${{ env.JSON_FILE }}
          BRANCH: ${{ env.BRANCH }}
          COMMIT: ${{ env.COMMIT }}
          CSV_FILE: ${{ env.CSV_FILE }}
        run: .github/scripts/quarto-wizard/main.sh
