name: Test Scripts

# The sweep runs once a month, so a regression in the classification or
# verdict logic would otherwise stay hidden until it misreports a whole
# catalogue. The registry generator runs nightly, and a wrong latest tag
# reaches every Quarto Wizard user without a token. These checks need no
# container, no Quarto and no network, and run in seconds, so they run on
# every change to the scripts they cover.
on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/test-extensions/**"
      - ".github/scripts/quarto-wizard/**"
      - ".github/workflows/test-scripts.yml"
  pull_request:
    paths:
      - ".github/scripts/test-extensions/**"
      - ".github/scripts/quarto-wizard/**"
      - ".github/workflows/test-scripts.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/test-extensions
            .github/scripts/quarto-wizard
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Run the script tests
        run: |
          .github/scripts/test-extensions/tests/classify.test.sh
          .github/scripts/test-extensions/tests/framework.test.sh
          .github/scripts/quarto-wizard/tests/latest-tag.test.sh
          .github/scripts/quarto-wizard/tests/prefetch.test.sh
          .github/scripts/quarto-wizard/tests/extension.test.sh
