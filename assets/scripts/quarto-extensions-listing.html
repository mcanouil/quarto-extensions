<script id="quarto-extensions-listing" type="text/javascript">
  document.addEventListener('DOMContentLoaded', function () {
    const root = document.getElementById('extensions-listing');
    if (!root) return;

    const PAGE_SIZE = parseInt(root.dataset.pageSize, 10) || 24;
    const INDEX_URL = root.dataset.index;
    const PLACEHOLDER = 'assets/media/github-placeholder.png';

    // Contribution kinds surfaced as quick-filter chips; matched as a prefix so
    // `revealjs-plugin` also catches `revealjs-plugins`.
    const CONTRIBUTION_FILTERS = ['shortcode', 'filter', 'format', 'project', 'revealjs-plugin', 'metadata'];

    // Categories that duplicate a chip or a badge and would only add noise to
    // the per-card badge row.
    const EXCLUDED_CATEGORIES = new Set([
      'example', 'template',
      'format', 'formats',
      'filter', 'filters',
      'shortcode', 'shortcodes'
    ]);

    const els = {
      results: document.getElementById('extensions-results'),
      empty: document.getElementById('extensions-empty'),
      counter: document.getElementById('extensions-counter'),
      search: document.getElementById('extension-search'),
      category: document.getElementById('category-filter'),
      sortField: document.getElementById('sort-field'),
      sortDirection: document.getElementById('sort-direction'),
      loadMore: document.getElementById('load-more'),
      clear: document.getElementById('clear-filters'),
      emptyClear: document.getElementById('empty-clear-filters'),
      gridView: document.getElementById('grid-view'),
      listView: document.getElementById('list-view'),
      modal: document.getElementById('extension-modal'),
      modalTitle: document.getElementById('extension-modal-label'),
      modalBody: document.getElementById('extension-modal-body')
    };

    let extensions = [];
    const byKey = new Map();
    let visible = [];

    const state = {
      query: '',
      filters: new Set(),
      author: null,
      category: '',
      sort: 'modified',
      direction: 'desc',
      view: 'grid',
      page: 1
    };

    // -----------------------------------------------------------------------
    // Helpers
    // -----------------------------------------------------------------------

    const escapeHtml = (value) => String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

    const relativeTime = (iso) => {
      const then = new Date(iso);
      if (Number.isNaN(then.getTime())) return 'unknown';
      const days = Math.max(1, Math.ceil(Math.abs(Date.now() - then) / 86400000));
      if (days === 1) return '1 day ago';
      if (days < 7) return `${days} days ago`;
      if (days < 30) {
        const weeks = Math.floor(days / 7);
        return weeks === 1 ? '1 week ago' : `${weeks} weeks ago`;
      }
      if (days < 365) {
        const months = Math.floor(days / 30);
        return months === 1 ? '1 month ago' : `${months} months ago`;
      }
      const years = Math.floor(days / 365);
      return years === 1 ? '1 year ago' : `${years} years ago`;
    };

    // Compare two version strings, descending (negative when `a` is newer).
    // A pre-release (for example 1.10.0-daily) ranks below the matching release.
    const compareVersionsDesc = (a, b) => {
      const core = (v) => String(v || '').split('+')[0].split('-')[0].split('.').map((n) => parseInt(n, 10) || 0);
      const pa = core(a);
      const pb = core(b);
      for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
        const diff = (pb[i] || 0) - (pa[i] || 0);
        if (diff !== 0) return diff;
      }
      const suffix = (v) => String(v || '').split('+')[0].split('-').slice(1).join('-');
      const sa = suffix(a);
      const sb = suffix(b);
      if (sa !== sb) {
        if (!sa) return -1;
        if (!sb) return 1;
        return sb.localeCompare(sa);
      }
      return 0;
    };

    // Keep the highest-version test result per channel.
    const latestTestByChannel = (tests) => {
      const latest = {};
      (tests || []).forEach((r) => {
        if (!r.channel) return;
        if (!latest[r.channel] || compareVersionsDesc(r.version, latest[r.channel].version) < 0) {
          latest[r.channel] = r;
        }
      });
      return latest;
    };

    // Card status from the latest release and latest pre-release only.
    const cardTestStatus = (tests) => {
      if (!tests || tests.length === 0) return 'none';
      const latest = latestTestByChannel(tests);
      const results = ['release', 'prerelease'].map((ch) => latest[ch]).filter(Boolean);
      if (results.length === 0) return 'none';
      if (results.some((r) => r.status === 'fail')) return 'fail';
      if (results.some((r) => r.status === 'pass')) return 'pass';
      return 'skip';
    };

    // Priority: superseded > deprecated > archived > experimental > stable.
    // Every status carries a label and its own icon, so the meaning survives
    // when the colour does not; superseded and deprecated previously shared
    // both a colour and an icon and so were indistinguishable.
    const STATUSES = [
      { name: 'superseded', text: 'Superseded', icon: 'bi-arrow-right-circle-fill' },
      { name: 'deprecated', text: 'Deprecated', icon: 'bi-exclamation-triangle-fill' },
      { name: 'archived', text: 'Archived', icon: 'bi-archive-fill' },
      { name: 'experimental', text: 'Experimental', icon: 'bi-flask' },
      { name: 'stable', text: 'Stable', icon: 'bi-check-circle-fill' }
    ];

    const statusBanner = (categories) => {
      const lower = new Set(categories.map((c) => c.toLowerCase()));
      return STATUSES.find((status) => lower.has(status.name)) || null;
    };

    // -----------------------------------------------------------------------
    // URL state
    // -----------------------------------------------------------------------

    const readStateFromUrl = () => {
      const params = new URLSearchParams(window.location.search);
      state.query = params.get('q') || '';
      state.filters = new Set((params.get('filter') || '').split(',').filter(Boolean));
      state.author = params.get('author') || null;
      state.category = params.get('category') || '';
      state.sort = ['modified', 'stars', 'title'].includes(params.get('sort')) ? params.get('sort') : 'modified';
      state.direction = params.get('dir') === 'asc' ? 'asc' : 'desc';
      state.view = params.get('view') === 'list' ? 'list' : 'grid';
      state.page = 1;
    };

    const writeStateToUrl = (push) => {
      const params = new URLSearchParams();
      if (state.query) params.set('q', state.query);
      if (state.filters.size) params.set('filter', Array.from(state.filters).join(','));
      if (state.author) params.set('author', state.author);
      if (state.category) params.set('category', state.category);
      if (state.sort !== 'modified') params.set('sort', state.sort);
      if (state.direction !== 'desc') params.set('dir', state.direction);
      if (state.view !== 'grid') params.set('view', state.view);
      const query = params.toString();
      const url = `${window.location.pathname}${query ? `?${query}` : ''}`;
      if (push) {
        window.history.pushState(null, '', url);
      } else {
        window.history.replaceState(null, '', url);
      }
    };

    // -----------------------------------------------------------------------
    // Filtering and sorting
    // -----------------------------------------------------------------------

    const matchesQuery = (item, query) => item.haystack.includes(query);

    const matchesFilters = (item) => {
      for (const filter of state.filters) {
        if (filter === 'test-pass') {
          if (item.testStatus !== 'pass') return false;
        } else if (filter === 'test-fail') {
          if (item.testStatus !== 'fail') return false;
        } else if (!item.contributes.some((value) => value.startsWith(filter))) {
          return false;
        }
      }
      return true;
    };

    const applyFilters = () => {
      const query = state.query.trim().toLowerCase();
      visible = extensions.filter((item) => {
        if (query && !matchesQuery(item, query)) return false;
        if (state.author && item.login !== state.author) return false;
        if (state.category && !item.categories.includes(state.category)) return false;
        return matchesFilters(item);
      });

      const direction = state.direction === 'asc' ? 1 : -1;
      visible.sort((a, b) => {
        let result;
        if (state.sort === 'stars') {
          result = a.stars - b.stars;
        } else if (state.sort === 'title') {
          result = a.title.localeCompare(b.title);
        } else {
          result = new Date(a.modified) - new Date(b.modified);
        }
        return result * direction;
      });
    };

    // -----------------------------------------------------------------------
    // Rendering
    // -----------------------------------------------------------------------

    const testBadges = (item) => {
      if (!item.tests.length) {
        return `<span class="test-badge-btn" style="cursor: default;">
          <i class="bi bi-question-circle text-muted" aria-hidden="true"></i>
          <span class="text-muted">No tests</span>
        </span>`;
      }
      const latest = latestTestByChannel(item.tests);
      return ['release', 'prerelease'].map((channel) => {
        const result = latest[channel];
        if (!result) return '';
        const icon = result.status === 'pass' ? 'bi-check-circle-fill'
          : result.status === 'fail' ? 'bi-x-circle-fill' : 'bi-dash-circle-fill';
        const colour = result.status === 'pass' ? 'text-success'
          : result.status === 'fail' ? 'text-danger' : 'text-secondary';
        const label = result.status.charAt(0).toUpperCase() + result.status.slice(1);
        const channelLabel = channel === 'prerelease' ? 'Pre-release' : 'Release';
        return `<button type="button" class="test-badge-btn" data-modal="tests" data-key="${escapeHtml(item.key)}"
          aria-label="${escapeHtml(label)} on Quarto ${escapeHtml(result.version)} (${channelLabel}). View test history.">
          <i class="bi ${icon} ${colour}" aria-hidden="true"></i>
          <span class="${colour}">${escapeHtml(result.version)}</span>
        </button>`;
      }).join('');
    };

    const categoryBadges = (item) => item.displayCategories.map((category) => `
      <button type="button" class="badge bg-light text-dark border-0 me-1 category-badge"
        data-category="${escapeHtml(category)}">${escapeHtml(category)}</button>`).join('');

    const cardMarkup = (item) => {
      const banner = statusBanner(item.categories);
      const image = item.image || PLACEHOLDER;
      const imageAlt = item.image
        ? `GitHub repository OpenGraph image for ${item.url}`
        : 'GitHub placeholder image';

      return `<div class="extension-cell g-col-12 g-col-sm-6 g-col-lg-4" role="listitem">
        <article class="card extension-card h-100">
          <div class="card-img-wrapper">
            <img src="${escapeHtml(image)}" loading="lazy" decoding="async" alt="${escapeHtml(imageAlt)}" class="card-img-top">
          </div>
          ${banner ? `<div class="status-banner status-${banner.name} text-center" role="status">
            <i class="bi ${banner.icon}" aria-hidden="true"></i> ${banner.text}
          </div>` : ''}
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-center mb-1 gap-2">
              <div class="test-status-badges-row d-flex flex-wrap gap-1">${testBadges(item)}</div>
              <div class="text-nowrap">
                ${item.template ? '<span class="badge badge-template ms-1">Template</span>' : ''}
                ${item.example ? '<span class="badge badge-example ms-1">Example</span>' : ''}
              </div>
            </div>
            <h3 class="card-title h6 d-flex align-items-center justify-content-between no-anchor extension-title">
              <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>
              <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer"
                class="btn btn-outline-body btn-sm ms-auto" aria-label="View ${escapeHtml(item.title)} on GitHub">
                <i class="bi bi-github" aria-hidden="true"></i>
              </a>
            </h3>
            <p class="card-text small text-muted mb-2">
              <button type="button" class="btn btn-link p-0 text-muted text-decoration-none author-filter"
                data-login="${escapeHtml(item.login)}">
                <i class="bi bi-person" aria-hidden="true"></i> ${escapeHtml(item.author)}
              </button>
            </p>
            <p class="card-text flex-grow-1 extension-description">${escapeHtml(item.description)}</p>
            <div class="card-categories mb-2">${categoryBadges(item)}</div>
            <div class="card-footer-info d-flex justify-content-between align-items-center small text-muted">
              <span><i class="bi bi-star-fill text-warning" aria-hidden="true"></i>
                <span class="visually-hidden">Stars:</span> ${item.stars}</span>
              <span><i class="bi bi-clock" aria-hidden="true"></i>
                <span class="visually-hidden">Updated:</span> ${relativeTime(item.modified)}</span>
            </div>
          </div>
          <div class="card-footer bg-transparent">
            <div class="d-flex gap-2 flex-wrap flex-sm-nowrap">
              <button type="button" class="btn btn-primary btn-sm flex-fill" data-modal="install" data-key="${escapeHtml(item.key)}">
                <i class="bi bi-download" aria-hidden="true"></i> Install
              </button>
              ${(item.template || item.example) ? `<button type="button" class="btn btn-use-${item.template ? 'template' : 'example'} btn-sm flex-fill"
                data-modal="use" data-key="${escapeHtml(item.key)}">
                <i class="bi bi-${item.template ? 'file-plus' : 'eye'}" aria-hidden="true"></i> Use
              </button>` : ''}
            </div>
          </div>
        </article>
      </div>`;
    };

    const render = () => {
      const shown = Math.min(state.page * PAGE_SIZE, visible.length);
      const fragment = document.createDocumentFragment();
      const holder = document.createElement('div');
      holder.innerHTML = visible.slice(0, shown).map(cardMarkup).join('');
      while (holder.firstElementChild) fragment.appendChild(holder.firstElementChild);

      els.results.replaceChildren(fragment);
      els.results.classList.toggle('list-mode', state.view === 'list');
      els.empty.classList.toggle('d-none', visible.length > 0);
      els.loadMore.classList.toggle('d-none', shown >= visible.length);
      els.loadMore.textContent = `Load more (${visible.length - shown} remaining)`;

      // Report what is on screen, not what matched: saying "all 359" while a
      // single page of 24 was rendered read as a rendering failure.
      const total = extensions.length;
      if (visible.length === 0) {
        // The empty-state panel already explains this; a count here would only
        // repeat it as "Showing all 0".
        els.counter.innerHTML = '';
        return;
      }
      const head = shown < visible.length ? `Showing ${shown} of ${visible.length}` : `Showing all ${visible.length}`;
      const tail = visible.length === total ? ' extensions' : ` matching extensions, out of ${total}`;
      els.counter.innerHTML = `<em>${head}${tail}</em>`;
    };

    const refresh = ({ resetPage = true, push = false } = {}) => {
      if (resetPage) state.page = 1;
      applyFilters();
      render();
      writeStateToUrl(push);
    };

    // -----------------------------------------------------------------------
    // Modal
    // -----------------------------------------------------------------------

    const codeBlock = (code) => `<div class="d-flex align-items-center gap-2">
      <pre class="flex-grow-1 mb-0"><code>${escapeHtml(code)}</code></pre>
      <button type="button" class="btn btn-outline-body btn-sm copy-button" data-copy="${escapeHtml(code)}"
        aria-label="Copy to clipboard"><i class="bi bi-clipboard" aria-hidden="true"></i></button>
    </div>`;

    const editorLinks = (usage) => {
      const editors = [
        ['Visual Studio Code', 'vscode'],
        ['Positron', 'positron'],
        ['VSCodium', 'vscodium']
      ];
      return `<div class="btn-group w-100" role="group" aria-label="Quarto Wizard installer options">
        ${editors.map(([label, scheme]) => `<a class="btn btn-outline-body"
          href="${scheme}://mcanouil.quarto-wizard/install?repo=${encodeURIComponent(usage)}"
          title="Install ${escapeHtml(usage)} in ${label} using the Quarto Wizard extension.">${label}</a>`).join('')}
      </div>`;
    };

    const modalContent = {
      install: (item) => ({
        title: `Install ${item.title}`,
        body: `<ul class="list-group list-group-flush">
          <li class="list-group-item">
            <p class="fw-bold mb-2"><i class="bi bi-terminal" aria-hidden="true"></i> Manually</p>
            ${codeBlock(`quarto add ${item.usage}`)}
          </li>
          <li class="list-group-item">
            <p class="fw-bold mb-2"><span class="quarto-wizard" aria-hidden="true"></span> Quarto Wizard</p>
            ${editorLinks(item.usage)}
          </li>
        </ul>`
      }),
      use: (item) => ({
        title: `Use ${item.title}`,
        body: `<ul class="list-group list-group-flush">
          <li class="list-group-item">
            <p class="fw-bold mb-2"><i class="bi bi-terminal" aria-hidden="true"></i> Manually</p>
            ${codeBlock(`quarto use template ${item.usage}`)}
          </li>
          <li class="list-group-item">
            <p class="fw-bold mb-2"><span class="quarto-wizard" aria-hidden="true"></span> Quarto Wizard</p>
            ${editorLinks(item.usage)}
          </li>
        </ul>`
      }),
      tests: (item) => {
        const rows = item.tests
          .slice()
          .sort((a, b) => compareVersionsDesc(a.version, b.version))
          .map((result) => {
            const icon = result.status === 'pass' ? 'bi-check-circle-fill text-success'
              : result.status === 'fail' ? 'bi-x-circle-fill text-danger' : 'bi-dash-circle-fill text-secondary';
            const logUrl = `https://github.com/mcanouil/quarto-extensions/tree/quarto-tests/${result.log}`;
            return `<tr>
              <td><code>${escapeHtml(result.version)}</code></td>
              <td>${result.channel === 'prerelease' ? 'Pre-release' : 'Release'}</td>
              <td><i class="bi ${icon}" aria-hidden="true"></i> ${escapeHtml(result.status)}</td>
              <td>${escapeHtml(result.date)}</td>
              <td><a href="${escapeHtml(logUrl)}" target="_blank" rel="noopener noreferrer">Log</a></td>
            </tr>`;
          }).join('');
        return {
          title: `Test history for ${item.title}`,
          body: `<table class="table table-sm align-middle mb-0">
            <thead><tr><th scope="col">Quarto</th><th scope="col">Channel</th><th scope="col">Status</th>
              <th scope="col">Date</th><th scope="col">Log</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>`
        };
      }
    };

    const openModal = (kind, key) => {
      const item = byKey.get(key);
      if (!item || !modalContent[kind]) return;
      const { title, body } = modalContent[kind](item);
      els.modalTitle.textContent = title;
      els.modalBody.innerHTML = body;
      window.bootstrap.Modal.getOrCreateInstance(els.modal).show();
    };

    // -----------------------------------------------------------------------
    // Events
    // -----------------------------------------------------------------------

    const debounce = (fn, wait) => {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), wait);
      };
    };

    els.search.addEventListener('input', debounce(() => {
      state.query = els.search.value;
      refresh();
    }, 200));

    els.category.addEventListener('change', () => {
      state.category = els.category.value;
      refresh();
    });

    els.sortField.addEventListener('change', () => {
      state.sort = els.sortField.value;
      refresh();
    });

    els.sortDirection.addEventListener('click', () => {
      state.direction = state.direction === 'desc' ? 'asc' : 'desc';
      syncSortDirection();
      refresh();
    });

    els.loadMore.addEventListener('click', () => {
      state.page += 1;
      render();
    });

    [els.clear, els.emptyClear].forEach((button) => button.addEventListener('click', () => {
      state.query = '';
      state.filters.clear();
      state.author = null;
      state.category = '';
      state.sort = 'modified';
      state.direction = 'desc';
      syncControls();
      refresh({ push: true });
    }));

    els.gridView.addEventListener('change', () => {
      if (!els.gridView.checked) return;
      state.view = 'grid';
      refresh({ resetPage: false });
    });

    els.listView.addEventListener('change', () => {
      if (!els.listView.checked) return;
      state.view = 'list';
      refresh({ resetPage: false });
    });

    root.addEventListener('click', (event) => {
      const chip = event.target.closest('.filter-chip');
      if (chip) {
        const filter = chip.dataset.filter;
        if (state.filters.has(filter)) state.filters.delete(filter);
        else state.filters.add(filter);
        chip.classList.toggle('active', state.filters.has(filter));
        chip.setAttribute('aria-pressed', String(state.filters.has(filter)));
        refresh({ push: true });
        return;
      }

      const author = event.target.closest('.author-filter');
      if (author) {
        state.author = state.author === author.dataset.login ? null : author.dataset.login;
        refresh({ push: true });
        return;
      }

      const category = event.target.closest('.category-badge');
      if (category) {
        state.category = state.category === category.dataset.category ? '' : category.dataset.category;
        els.category.value = state.category;
        refresh({ push: true });
        return;
      }

      const trigger = event.target.closest('[data-modal]');
      if (trigger) {
        openModal(trigger.dataset.modal, trigger.dataset.key);
      }
    });

    els.modalBody.addEventListener('click', (event) => {
      const button = event.target.closest('.copy-button');
      if (!button) return;
      navigator.clipboard.writeText(button.dataset.copy).then(() => {
        const icon = button.querySelector('i');
        icon.className = 'bi bi-clipboard-check';
        setTimeout(() => { icon.className = 'bi bi-clipboard'; }, 1500);
      }).catch(() => {
        button.setAttribute('title', 'Press Ctrl+C to copy');
      });
    });

    // `/` focuses search, the convention on documentation sites, unless the
    // visitor is already typing somewhere.
    document.addEventListener('keydown', (event) => {
      if (event.key !== '/' || event.metaKey || event.ctrlKey || event.altKey) return;
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      event.preventDefault();
      els.search.focus();
    });

    window.addEventListener('popstate', () => {
      readStateFromUrl();
      syncControls();
      applyFilters();
      render();
    });

    // -----------------------------------------------------------------------
    // Control synchronisation
    // -----------------------------------------------------------------------

    function syncSortDirection() {
      const descending = state.direction === 'desc';
      els.sortDirection.dataset.direction = state.direction;
      els.sortDirection.setAttribute('aria-label', descending ? 'Sort descending' : 'Sort ascending');
      els.sortDirection.querySelector('i').className = descending ? 'bi bi-sort-down' : 'bi bi-sort-up';
    }

    function syncControls() {
      els.search.value = state.query;
      els.category.value = state.category;
      els.sortField.value = state.sort;
      syncSortDirection();
      els.gridView.checked = state.view === 'grid';
      els.listView.checked = state.view === 'list';
      root.querySelectorAll('.filter-chip').forEach((chip) => {
        const active = state.filters.has(chip.dataset.filter);
        chip.classList.toggle('active', active);
        chip.setAttribute('aria-pressed', String(active));
      });
    }

    // -----------------------------------------------------------------------
    // Boot
    // -----------------------------------------------------------------------

    const prepare = (raw) => raw.map((item) => {
      const displayCategories = (item.categories || [])
        .filter((category) => !EXCLUDED_CATEGORIES.has(category.toLowerCase()));
      return Object.assign({}, item, {
        categories: item.categories || [],
        contributes: item.contributes || [],
        tests: item.tests || [],
        displayCategories,
        testStatus: cardTestStatus(item.tests),
        haystack: [
          item.title, item.description, item.author, item.login,
          (item.categories || []).join(' '), (item.contributes || []).join(' ')
        ].join(' ').toLowerCase()
      });
    });

    const populateCategories = () => {
      const counts = new Map();
      extensions.forEach((item) => item.displayCategories.forEach((category) => {
        counts.set(category, (counts.get(category) || 0) + 1);
      }));
      const options = Array.from(counts.entries())
        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
        .map(([category, count]) => {
          const option = document.createElement('option');
          option.value = category;
          option.textContent = `${category} (${count})`;
          return option;
        });
      els.category.append(...options);
    };

    fetch(INDEX_URL)
      .then((response) => {
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        return response.json();
      })
      .then((raw) => {
        extensions = prepare(raw);
        extensions.forEach((item) => byKey.set(item.key, item));
        populateCategories();
        readStateFromUrl();
        syncControls();
        applyFilters();
        render();
      })
      .catch((error) => {
        els.counter.innerHTML = '<span class="text-danger">The extension index failed to load. Please reload the page.</span>';
        console.error('Failed to load the extension index:', error);
      });
  });
</script>
